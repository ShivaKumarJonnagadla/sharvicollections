<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-source.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c1f3f" />
    <meta
      name="description"
      content="Sharvi Collections — Affordable Multicultural Jewelry for Every Moment. Western, Indian and Middle Eastern inspired designs from Älmhult, Sweden."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sharvi Collections — Multicultural Jewellery</title>
    <!-- Capture the install prompt as early as possible; it can fire before React mounts. -->
    <script>
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new Event('pwa-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaPrompt = null;
        window.dispatchEvent(new Event('pwa-available'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
